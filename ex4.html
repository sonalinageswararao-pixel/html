<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #gridbox{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            height: 100vh;
            width: 100vw;
        }
        #box1{
            background-color:hsl(60, 100%, 50%);
            justify-content: center;
            display: flex;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
        #box2{
            background-color:hsl(120, 100%, 50%);
            text-align: center;
            justify-content: center;
            display: flex;
            font-size: 30px;
            font-weight: bold;
            align-items: center;
        }
        #box3{
            background-color:hsl(240, 100%, 50%);
            justify-content: center;
            display: flex;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
        #box4{
            background-color:hsl(0, 100%, 50%);
            justify-content: center;
            display: flex;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
        #box5{
            background-color:hsl(180, 100%, 50%);
            justify-content: center;
            display: flex;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
        #box6{
            background-color:hsl(300, 100%, 50%);
            justify-content: center;
            display: flex;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gridbox">
        <div id="box1"><img src="./download.webp" alt="Image 1"></div>
        <div id="box2"><img src="./download.webp" alt="Image 2"></div>
        <div id="box3"><img src="./download.webp" alt="Image 3"></div>
        <div id="box4"><img src="./download.webp" alt="Image 4"></div>
        <div id="box5"><img src="./download.webp" alt="Image 5"></div>
        <div id="box6"><img src="./download.webp" alt="Image 6"></div>
    </div>
</body>
</html>
